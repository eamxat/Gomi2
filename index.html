<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Gomi Xatspace</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Road+Rage&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Special+Elite&display=swap');

        :root {
            --bg-color-1: #0a0a0a; 
            --bg-color-2: #1a1a1a; 
            --accent-main: #ffffff; 
            --accent-hover: #666666; 
            --accent-bright: #ffffff; 
            --text-dark: #ffffff; 
            --text-muted: #cccccc; 
            
            --glass-bg: rgba(20, 20, 20, 0.75); 
            --glass-border: rgba(255, 255, 255, 0.15);
            --glass-highlight: rgba(255, 255, 255, 0.3);
            
            --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.5);
            --shadow-md: 0 8px 24px -4px rgba(0, 0, 0, 0.7);
            --shadow-lg: 0 16px 40px -8px rgba(0, 0, 0, 0.9);
            --shadow-hover: 0 24px 48px -12px rgba(255, 255, 255, 0.2);
            
            --transition-smooth: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        img[src=""], img:not([src]) { opacity: 0 !important; visibility: hidden !important; pointer-events: none !important; box-shadow: none !important; }

        body {
            font-family: 'Outfit', sans-serif;
            color: var(--text-dark);
            background-color: var(--bg-color-1);
            overflow: hidden; 
            width: 100vw;
            height: 100vh;
            height: 100dvh; /* dvh for mobile browser UI handling */
            max-width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
            padding-top: max(65px, env(safe-area-inset-top)); /* iOS Notch safe area */
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
            padding-bottom: env(safe-area-inset-bottom);
            box-sizing: border-box;
        }

        body::before {
            content: "";
            position: fixed; top: -50%; left: -50%; width: 200%; height: 200%;
            pointer-events: none; z-index: 9998;
            background: url('data:image/svg+xml,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="1.8" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)" opacity="0.08"/%3E%3C/svg%3E');
            animation: grain-anim 0.3s steps(4) infinite;
            mix-blend-mode: screen;
        }

        @keyframes grain-anim {
            0% { transform: translate(0, 0); }
            25% { transform: translate(-1%, -1%); }
            50% { transform: translate(-2%, 1%); }
            75% { transform: translate(1%, -2%); }
            100% { transform: translate(0%, 0%); }
        }

        #scanlines {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: 9998; opacity: 0.15;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.3) 50%, rgba(0,0,0,0.3));
            background-size: 100% 4px;
            animation: scanline-scroll 8s linear infinite;
        }

        @keyframes scanline-scroll {
            0% { background-position: 0 0; }
            100% { background-position: 0 100vh; }
        }

        img, video { filter: grayscale(100%) contrast(120%); transition: filter 0.4s ease; max-width: 100%; }
        iframe { filter: none !important; max-width: 100%; }
        .photo-card img:hover, .gif-item:hover, .v-music-stacked video:hover { filter: grayscale(0%) contrast(100%); }
        
        /* Intro video explicitly excludes the global grayscale filter */
        #intro-screen video.intro-bg { filter: none; }

        @media (pointer: fine) {
            * { cursor: none !important; }
            .custom-cursor {
                position: fixed; top: 0; left: 0; pointer-events: none; z-index: 9999;
                width: 32px; height: 32px; transform: translate(-50%, -50%);
                transition: transform 0.1s ease-out;
                display: flex; justify-content: center; align-items: center;
            }
            .custom-cursor::after {
                content: '';
                width: 100%; height: 100%;
                background: url('cursor.png') no-repeat center;
                background-size: contain;
                filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.5));
            }
            .custom-cursor.click { transform: translate(-50%, -50%) scale(0.8); }
            
            .cursor-trail {
                position: fixed; top: 0; left: 0; pointer-events: none; z-index: 9998;
                width: 10px; height: 10px; border-radius: 50%;
                background: var(--accent-bright); filter: blur(4px);
                transform: translate(-50%, -50%); transition: 0.1s linear; opacity: 0.4;
            }
        }

        #bg-video {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            object-fit: cover; z-index: -3; pointer-events: none; opacity: 1;
        }

        #particles-canvas {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: -1;
        }

        #cursor-canvas {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: 9997; 
        }

        .ambient-background {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -2;
            background: linear-gradient(135deg, rgba(10, 10, 10, 0.4), rgba(26, 26, 26, 0.45));
            pointer-events: none;
        }

        .clouds-container {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: -2; overflow: hidden;
        }
        .cloud {
            position: absolute; background: #FFF; border-radius: 200px;
            filter: blur(15px); opacity: 0.1; animation: drift linear infinite;
        }
        .cloud::before, .cloud::after { content: ''; position: absolute; background: #FFF; border-radius: 50%; }
        .cloud-1 { width: 300px; height: 100px; top: 15%; left: -350px; animation-duration: 45s; }
        .cloud-1::before { width: 150px; height: 150px; top: -70px; left: 40px; }
        .cloud-1::after { width: 120px; height: 120px; top: -50px; left: 140px; }
        .cloud-2 { width: 250px; height: 80px; top: 65%; left: -300px; animation-duration: 60s; opacity: 0.05; }
        .cloud-2::before { width: 120px; height: 120px; top: -60px; left: 30px; }
        .cloud-2::after { width: 100px; height: 100px; top: -40px; left: 110px; }
        .cloud-3 { width: 400px; height: 120px; top: 35%; left: -500px; animation-duration: 75s; opacity: 0.08; transform: scale(1.2); }
        .cloud-3::before { width: 180px; height: 180px; top: -90px; left: 50px; }
        .cloud-3::after { width: 140px; height: 140px; top: -60px; left: 160px; }
        @keyframes drift { from { transform: translateX(-15vw); } to { transform: translateX(115vw); } }

        .navbar {
            position: fixed;
            top: calc(clamp(1rem, 3vh, 2rem) + max(65px, env(safe-area-inset-top))); 
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(0, 0, 0, 0.6); 
            backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border); border-top: 1px solid var(--glass-highlight);
            border-radius: 4px; padding: 0.5rem 1rem; display: flex; gap: clamp(0.2rem, 1vw, 0.5rem);
            box-shadow: var(--shadow-sm);
            max-width: calc(100vw - 2rem);
            width: max-content;
        }

        .nav-link {
            text-decoration: none; color: var(--text-dark);
            font-size: clamp(0.75rem, 1.5vh, 0.85rem); font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
            padding: clamp(0.4rem, 1vh, 0.6rem) clamp(0.8rem, 2vw, 1.2rem);
            border-radius: 4px; transition: var(--transition-smooth); cursor: pointer; border: none; background: transparent; font-family: inherit;
        }

        .nav-link:hover, .nav-link.active {
            color: white; background: var(--accent-hover); box-shadow: var(--shadow-sm);
        }

        .main-glass-panel {
            width: 90vw; max-width: 1200px; height: clamp(400px, 80dvh, 85dvh); 
            max-height: calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 80px);
            margin-top: clamp(3rem, 8vh, 5rem); 
            background: var(--glass-bg); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border); border-top: 1px solid var(--glass-highlight); border-radius: 4px;
            box-shadow: var(--shadow-lg); 
            position: relative; z-index: 10; overflow: hidden;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            transform: translateZ(0);
        }

        .tab-content {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            padding: clamp(1.5rem, 4vh, 4rem); opacity: 0; pointer-events: none;
            visibility: hidden; 
            transform: translateY(20px) scale(0.98); transition: var(--transition-smooth);
            display: flex; align-items: center; justify-content: center;
            overflow-y: auto; 
            overflow-x: hidden;
            scrollbar-width: none; 
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            will-change: transform, opacity;
        }
        
        .tab-content::-webkit-scrollbar { width: 0px; display: none; background: transparent; }
        .tab-content.active { opacity: 1; pointer-events: auto; visibility: visible; transform: translateY(0) scale(1); }

        .hero-layout { display: grid; grid-template-columns: 1fr 1fr; width: 100%; height: 100%; gap: clamp(1.5rem, 4vw, 4rem); align-items: center; }
        #tab-hero { flex-direction: column; justify-content: flex-start; }
        #tab-hero .hero-layout { height: auto; flex: 1 0 auto; min-height: 0; }
        .hero-content { display: flex; flex-direction: column; gap: clamp(1rem, 2vh, 1.5rem); max-width: 100%; }

        .status-container {
            display: flex; align-items: center; gap: 0.8rem;
            background: rgba(0, 0, 0, 0.6); padding: 0.5rem 1rem;
            width: fit-content; max-width: 100%; border: 1px solid var(--accent-main);
            margin-bottom: 0.5rem; box-shadow: var(--shadow-sm);
            border-radius: 2px;
            position: relative;
            margin-top: 85px; 
        }
        
        .avatar-mini {
            width: 50px; height: 50px; flex-shrink: 0; border-radius: 2px; background: #000;
            border: 1px solid var(--accent-main); overflow: hidden; display: flex; justify-content: center; align-items: center;
        }
        .avatar-mini img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
        
        .status-info { 
            display: flex; flex-direction: column; justify-content: center;
            transition: transform 0.3s ease; 
            cursor: default;
        }
        .status-info:hover {
            transform: translateY(-2px);
        }
        
        .status-text { 
            font-size: 1rem; font-weight: 700; color: var(--text-dark); 
            transition: all 0.3s ease;
        }
        .status-info:hover .status-text {
            color: #ffffff;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
        }
        
        .status-dot {
            width: 8px; height: 8px; flex-shrink: 0; background: transparent; border-radius: 50%;
        }
        
        .dot-online {
            background: #2ecc71; box-shadow: 0 0 8px #2ecc71; 
            animation: pulse-green 1.5s infinite;
        }
        
        .dot-offline {
            background: #e74c3c; box-shadow: 0 0 8px #e74c3c; 
            animation: pulse-red 1.5s infinite;
        }
        
        .status-year { 
            font-size: 0.75rem; font-weight: 600; color: var(--text-muted); 
            transition: all 0.3s ease;
        }
        .status-info:hover .status-year {
            color: #ffffff;
        }

        @keyframes pulse-green {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.6; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        @keyframes pulse-red {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.6; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Efecto Glitter para ZB0I0MeLxBmf.png */
        .glitter-wrapper {
            position: relative;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 280px;
            margin: 0.5rem 0;
            z-index: 5;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), filter 0.4s ease;
        }

        .glitter-wrapper:hover {
            transform: scale(1.05);
            filter: drop-shadow(0 0 15px rgba(220, 20, 60, 0.7));
        }
        
        .glitter-wrapper img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
            filter: drop-shadow(0 4px 12px rgba(0,0,0,0.5));
            transition: filter 0.4s ease;
        }

        .glitter-wrapper:hover img {
            filter: brightness(1.15) contrast(1.1);
        }

        .glitter-wrapper::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 11;
            background-image: 
                radial-gradient(1.5px 1.5px at 15px 15px, white, transparent),
                radial-gradient(2px 2px at 40px 25px, white, transparent),
                radial-gradient(1px 1px at 20px 45px, white, transparent),
                radial-gradient(2.5px 2.5px at 60px 10px, white, transparent),
                radial-gradient(1.5px 1.5px at 75px 40px, white, transparent),
                radial-gradient(2px 2px at 90px 20px, white, transparent),
                radial-gradient(1px 1px at 10px 70px, white, transparent),
                radial-gradient(2px 2px at 50px 65px, white, transparent);
            background-size: 100px 80px;
            -webkit-mask-image: url("https://xatimg.com/image/ZB0I0MeLxBmf.png");
            -webkit-mask-size: contain;
            -webkit-mask-repeat: no-repeat;
            -webkit-mask-position: center;
            mask-image: url("https://xatimg.com/image/ZB0I0MeLxBmf.png");
            mask-size: contain;
            mask-repeat: no-repeat;
            mask-position: center;
            mix-blend-mode: color-dodge;
            animation: glitterTwinkle 1.5s infinite alternate ease-in-out, glitterMove 20s infinite linear;
        }

        .glitter-wrapper::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 10;
            background: linear-gradient(
                110deg,
                transparent 25%,
                rgba(255,255,255,0.15) 40%,
                rgba(255,255,255,0.65) 47%,
                rgba(255,255,255,1) 50%,
                rgba(255,255,255,0.65) 53%,
                rgba(255,255,255,0.15) 60%,
                transparent 75%
            );
            background-size: 200% 100%;
            -webkit-mask-image: url("https://xatimg.com/image/ZB0I0MeLxBmf.png");
            -webkit-mask-size: contain;
            -webkit-mask-repeat: no-repeat;
            -webkit-mask-position: center;
            mask-image: url("https://xatimg.com/image/ZB0I0MeLxBmf.png");
            mask-size: contain;
            mask-repeat: no-repeat;
            mask-position: center;
            animation: glitterShineSweep 3.5s infinite linear;
            mix-blend-mode: color-dodge;
        }

        @keyframes glitterShineSweep {
            0% { background-position: 200% center; }
            100% { background-position: -200% center; }
        }

        @keyframes glitterTwinkle {
            0% { opacity: 0.1; filter: brightness(0.5); }
            100% { opacity: 0.9; filter: brightness(1.5) drop-shadow(0 0 2px white); }
        }
        
        @keyframes glitterMove {
            0% { background-position: 0px 0px; }
            100% { background-position: 100px 80px; }
        }

        /* Inner Shine Hover Real para DLAWoAPcZv55.png */
        .hero-shine-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            width: 100%;
            max-width: 280px;
            margin: 0.5rem 0;
            z-index: 5;
            line-height: 0;
            font-size: 0;
        }

        .hero-shine-wrapper img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
            filter: drop-shadow(0 4px 12px rgba(0,0,0,0.5));
        }

        .hero-shine-wrapper::after {
            content: '';
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            background: linear-gradient(
                45deg,
                transparent 0%,
                transparent 44%,
                rgba(255,255,255,0.98) 50%,
                transparent 56%,
                transparent 100%
            );
            background-size: 50% 100%;
            background-repeat: no-repeat;
            background-position: -100% center;
            
            -webkit-mask-image: url("https://xatimg.com/image/DLAWoAPcZv55.png");
            -webkit-mask-size: 100% 100%;
            -webkit-mask-repeat: no-repeat;
            -webkit-mask-position: center;
            -webkit-mask-mode: alpha;
            
            mask-image: url("https://xatimg.com/image/DLAWoAPcZv55.png");
            mask-size: 100% 100%;
            mask-repeat: no-repeat;
            mask-position: center;
            mask-mode: alpha;
            
            transition: background-position 0s;
        }

        @media (hover: hover) and (pointer: fine) {
            .hero-shine-wrapper:hover::after {
                background-position: 200% center;
                transition: background-position 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            }
        }

        .hero-text-block { display: flex; flex-direction: column; gap: clamp(0.2rem, 1vh, 0.5rem); max-width: 100%; }
        
        .fade-text { transition: opacity 0.8s ease-in-out; opacity: 1; max-width: 100%; }
        .fade-text.hidden { opacity: 0; }
        
        .hero-subtitle { font-family: 'Special Elite', monospace; font-size: clamp(1.4rem, 2.8vh, 1.8rem); font-weight: normal; color: var(--text-dark); word-wrap: break-word; }
        .hero-description { font-family: 'Special Elite', monospace; font-size: clamp(0.95rem, 1.8vh, 1.25rem); font-weight: 500; color: var(--text-muted); max-width: 95%; line-height: 1.5; word-wrap: break-word; }

        .gemini-block {
            display: flex; flex-direction: column; align-items: flex-start; gap: 0.5rem;
            margin-top: 0.5rem;
        }
        
        .btn-click-me {
            position: relative; background: rgba(0, 0, 0, 0.5); border: 1px solid var(--accent-bright);
            color: var(--accent-main); border-radius: 2px; padding: 0.3rem 1rem;
            font-weight: 700; font-size: 0.8rem; cursor: pointer; transition: var(--transition-smooth);
            font-family: inherit; overflow: visible; text-transform: uppercase;
        }
        .btn-click-me:hover { background: var(--accent-hover); color: white; border-color: var(--accent-hover); box-shadow: var(--shadow-sm); }
        
        .sparkle-particle {
            position: absolute; width: 36px; height: 36px; pointer-events: none; z-index: 9999;
            animation: sparkleFly 0.8s ease-out forwards;
            filter: drop-shadow(0 0 6px var(--accent-bright)) brightness(1.2);
        }
        @keyframes sparkleFly {
            0% { transform: translate(-50%, -50%) scale(0.5) rotate(0deg); opacity: 1; }
            70% { opacity: 1; } 
            100% { transform: translate(var(--tx), var(--ty)) scale(1.6) rotate(90deg); opacity: 0; }
        }

        .pink-clock {
            font-size: clamp(1.1rem, 2.5vh, 1.4rem);
            font-weight: normal;
            color: var(--accent-bright);
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--glass-highlight);
            padding: 0.4rem 1.2rem;
            border-radius: 2px;
            box-shadow: var(--shadow-sm);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            letter-spacing: 2px;
            transition: var(--transition-smooth);
            z-index: 5;
            text-align: center;
            max-width: 100%;
        }
        .pink-clock:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
            background: var(--accent-hover);
            color: white;
            border-color: var(--accent-hover);
        }

        .hero-visuals { display: flex; justify-content: center; align-items: center; height: 100%; width: 100%; flex-direction: column; gap: 1.5rem; }

        .gif-grid { 
            width: clamp(260px, 90%, 650px); max-width: 100%; aspect-ratio: 4/3; 
            display: grid; grid-template-columns: 1fr 1.5fr 1fr; grid-template-rows: minmax(0, 1fr) minmax(0, 1fr); gap: 6px;
            border-radius: 4px; border: 2px solid #444; padding: 6px; background: #000;
            box-shadow: var(--shadow-lg); transition: var(--transition-smooth); 
            overflow: hidden;
        }
        .gif-grid:hover { transform: translateY(-4px); box-shadow: 10px 10px 0 var(--accent-hover); border-color: var(--accent-hover); }
        .gif-item { width: 100%; height: 100%; max-width: 100%; max-height: 100%; min-width: 0; min-height: 0; object-fit: cover; border-radius: 2px; filter: grayscale(100%) contrast(120%); transition: var(--transition-smooth); }
        .gif-item:hover { filter: grayscale(0%) contrast(100%); }
        
        .gif-item:nth-child(1) { grid-column: 1; grid-row: 1; }
        .gif-item:nth-child(2) { grid-column: 1; grid-row: 2; }
        .gif-item:nth-child(3) { grid-column: 2; grid-row: 1 / span 2; object-fit: contain; }
        .gif-item:nth-child(4) { grid-column: 3; grid-row: 1; }
        .gif-item:nth-child(5) { grid-column: 3; grid-row: 2; }

        .footer-signature {
            position: relative;
            bottom: auto;
            left: auto;
            transform: none;
            font-size: 0.7rem;
            font-weight: 500;
            color: var(--text-muted);
            opacity: 0.6;
            pointer-events: none;
            white-space: nowrap;
            letter-spacing: 0.05em;
            width: 100%;
            text-align: center;
            margin-top: auto;
            padding-top: 1.5rem;
            flex-shrink: 0;
        }

        .music-layout { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: clamp(1rem, 3vh, 2rem); width: 100%; height: 100%; padding-top: 2vh; }
        .section-header { text-align: center; max-width: 100%; }
        .section-title { font-size: clamp(2.5rem, 6vh, 4rem); color: var(--accent-main); line-height: 1; font-weight: normal; word-wrap: break-word; }

        .music-content { display: flex; flex-direction: row; align-items: center; justify-content: center; width: 100%; height: 100%; position: relative; }

        .player-pro { display: flex; flex-direction: column; align-items: center; gap: clamp(1.5rem, 3vh, 2rem); position: relative; width: 100%; max-width: 350px; z-index: 5; }

        .player-disc {
            width: clamp(140px, 25vh, 220px); height: clamp(140px, 25vh, 220px);
            border-radius: 50%; background: linear-gradient(135deg, rgba(20,20,20,0.9), rgba(50,50,50,0.4));

        .photo-card::after {
            content: '';
            position: absolute;

            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;

        document.addEventListener("DOMContentLoaded", () => {
            const canvas = document.getElementById('particles-canvas');
            const ctx = canvas.getContext('2d');
            const cursorCanvas = document.getElementById('cursor-canvas');
            const cursorCtx = cursorCanvas.getContext('2d');
            let particles = [];
            let cursorParticles = []; 
            
            let mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2;

            if (window.matchMedia("(pointer: fine)").matches) {
                const cursor = document.createElement('div');
                cursor.classList.add('custom-cursor');
                const trail = document.createElement('div');
                trail.classList.add('cursor-trail');
                document.body.appendChild(cursor);
                document.body.appendChild(trail);
                
                let trailX = mouseX, trailY = mouseY;
                
                window.addEventListener('mousemove', e => {
                    mouseX = e.clientX; mouseY = e.clientY;
                    cursor.style.left = mouseX + 'px';
                    cursor.style.top = mouseY + 'px';
                    
                    for(let i=0; i<2; i++) {
                        cursorParticles.push(new CursorStar(mouseX, mouseY));
                    }
                });
                
                const renderTrail = () => {
                    trailX += (mouseX - trailX) * 0.2;
                    trailY += (mouseY - trailY) * 0.2;
                    trail.style.left = trailX + 'px';
                    trail.style.top = trailY + 'px';
                    requestAnimationFrame(renderTrail);
                };
                renderTrail();
                
                window.addEventListener('mousedown', () => cursor.classList.add('click'));
                window.addEventListener('mouseup', () => cursor.classList.remove('click'));
            }

            const navLinks = document.querySelectorAll('.nav-link');
            const tabs = document.querySelectorAll('.tab-content');
            navLinks.forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    const targetId = link.getAttribute('data-target');
                    navLinks.forEach(l => l.classList.remove('active'));
                    tabs.forEach(t => t.classList.remove('active'));
                    link.classList.add('active');
                    document.getElementById(targetId).classList.add('active');
                });
            });

            const audio = document.getElementById('audio-player');
            const btnPlayPause = document.getElementById('btn-play-pause');
            const iconPlay = document.getElementById('icon-play');
            const iconPause = document.getElementById('icon-pause');
            const volumeSlider = document.getElementById('volume-slider');
            const musicUI = document.getElementById('music-ui');
            let isPlaying = false;
            audio.volume = volumeSlider.value;
            btnPlayPause.addEventListener('click', () => {
                if (isPlaying) {
                    audio.pause();
                    iconPlay.style.display = 'block';
                    iconPause.style.display = 'none';
                    musicUI.classList.remove('is-playing');
                } else {
                    audio.play().catch(e => console.log("Auto-play prevented"));
                    iconPlay.style.display = 'none';
                    iconPause.style.display = 'block';
                    musicUI.classList.add('is-playing');
                }
                isPlaying = !isPlaying;
            });
            volumeSlider.addEventListener('input', (e) => audio.volume = e.target.value);

            const introScreen = document.getElementById('intro-screen');
            const btnEnter = document.getElementById('btn-enter');
            
            if (btnEnter && introScreen) {
                btnEnter.addEventListener('click', () => {
                    introScreen.classList.add('intro-hidden');
                    setTimeout(() => {
                        introScreen.style.display = 'none';
                    }, 800);
                    
                    if (!isPlaying) {
                        audio.play().then(() => {
                            iconPlay.style.display = 'none';
                            iconPause.style.display = 'block';
                            musicUI.classList.add('is-playing');
                            isPlaying = true;
                        }).catch(e => console.log("Autoplay bloqueado:", e));
                    }
                });
            }

            let pCurrentX = 0, pCurrentY = 0;
            const pLerp = (start, end, factor) => start + (end - start) * factor;
            const renderParallax = () => {
                pCurrentX = pLerp(pCurrentX, (mouseX / window.innerWidth - 0.5) * 2, 0.05);
                pCurrentY = pLerp(pCurrentY, (mouseY / window.innerHeight - 0.5) * 2, 0.05);
                const activeElements = document.querySelectorAll('.tab-content.active .js-parallax');
                activeElements.forEach(el => {
                    const depth = parseFloat(el.getAttribute('data-depth')) || 0.1;
                    el.style.transform = `translate3d(${pCurrentX * depth * 150}px, ${pCurrentY * depth * 150}px, 0)`;
                });
                requestAnimationFrame(renderParallax);
            };
            if (window.matchMedia("(hover: hover)").matches) renderParallax();

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                cursorCanvas.width = window.innerWidth;
                cursorCanvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            const particleColors = ['#FFFFFF', '#AAAAAA', '#666666'];
            const shapes = ['✦', '✧', '⋆'];

            class Particle {
                constructor() { this.reset(); this.y = Math.random() * canvas.height; }
                reset() {
                    this.x = Math.random() * canvas.width;
                    this.y = canvas.height + 20;
                    this.size = Math.random() * 3 + 1.5;
                    this.speedY = Math.random() * 0.4 + 0.1; 
                    this.speedX = (Math.random() - 0.5) * 0.2;
                    this.color = particleColors[Math.floor(Math.random() * particleColors.length)];
                    this.shape = shapes[Math.floor(Math.random() * shapes.length)];
                    this.opacity = Math.random() * 0.5 + 0.2;
                }
                update() {
                    this.y -= this.speedY; this.x += this.speedX;
                    this.x -= pCurrentX * this.size * 0.5;
                    this.y -= pCurrentY * this.size * 0.5;
                    if (this.y < -30) this.reset();
                }
                draw() {
                    ctx.save();
                    ctx.globalAlpha = this.opacity;
                    ctx.fillStyle = this.color;
                    ctx.shadowBlur = 8; ctx.shadowColor = this.color;
                    ctx.font = `${this.size * 5}px Arial`;
                    ctx.fillText(this.shape, this.x, this.y);
                    ctx.restore();
                }
            }

            class CursorStar {
                constructor(x, y) {
                    this.x = x;
                    this.y = y;
                    this.size = Math.random() * 2 + 2;
                    this.vx = (Math.random() - 0.5) * 2.5;
                    this.vy = (Math.random() - 0.5) * 2.5;
                    this.life = 1.0;
                    this.decay = Math.random() * 0.02 + 0.01;
                    this.color = particleColors[Math.floor(Math.random() * particleColors.length)];
                    this.shape = shapes[Math.floor(Math.random() * shapes.length)];
                }
                update() {
                    this.x += this.vx;
                    this.y += this.vy;
                    this.life -= this.decay;
                }
                draw() {
                    if(this.life <= 0) return;
                    cursorCtx.save();
                    cursorCtx.globalAlpha = this.life;
                    cursorCtx.fillStyle = this.color;
                    cursorCtx.shadowBlur = 10;
                    cursorCtx.shadowColor = this.color;
                    cursorCtx.font = `${this.size * 6}px Arial`;
                    cursorCtx.fillText(this.shape, this.x, this.y);
                    cursorCtx.restore();
                }
            }

            const particleCount = window.innerWidth < 768 ? 20 : 50;
            for (let i = 0; i < particleCount; i++) particles.push(new Particle());

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                cursorCtx.clearRect(0, 0, cursorCanvas.width, cursorCanvas.height);
                
                particles.forEach(p => { p.update(); p.draw(); });
                
                for (let i = 0; i < cursorParticles.length; i++) {
                    cursorParticles[i].update();
                    cursorParticles[i].draw();
                    if (cursorParticles[i].life <= 0) {
                        cursorParticles.splice(i, 1);
                        i--;
                    }
                }
                
                requestAnimationFrame(animate);
            }
            animate();

            const heroQuotes = [
                { title: "GOMI", desc: "La MamiChula" },
                { title: "GOMI", desc: "Una bad bitch, Girl De lo' 90" },
                { title: "GOMI", desc: "Fina pero bandida" },
                { title: "GOMI", desc: "Más perra que el filtro de snapchat" }
            ];

            let currentQuote = 0;
            const quoteContent = document.getElementById('quote-content');
            const quoteTitle = document.getElementById('quote-title');
            const quoteDesc = document.getElementById('quote-desc');

            if (quoteContent) {
                setInterval(() => {
                    quoteContent.classList.add('hidden');
                    setTimeout(() => {
                        currentQuote = (currentQuote + 1) % heroQuotes.length;
                        quoteTitle.textContent = heroQuotes[currentQuote].title;
                        quoteDesc.textContent = heroQuotes[currentQuote].desc;
                        quoteContent.classList.remove('hidden');
                    }, 800); 
                }, 5000); 
            }

            const clickMeButtons = document.querySelectorAll('.btn-click-me');
            if (clickMeButtons.length > 0) {
                clickMeButtons.forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        for(let i = 0; i < 6; i++) {
                            const faceEmoji = document.createElement('img');
                            faceEmoji.src = 'https://xatimg.com/image/EbjBtXj82zo3.png';
                            faceEmoji.className = 'sparkle-particle';
                            
                            faceEmoji.style.width = '45px';
                            faceEmoji.style.height = '45px';
                            faceEmoji.style.objectFit = 'contain';
                            faceEmoji.style.background = 'transparent';
                            
                            const angleFace = Math.random() * Math.PI * 2;
                            const distanceFace = Math.random() * 40 + 35;
                            const txFace = Math.cos(angleFace) * distanceFace + 'px';
                            const tyFace = Math.sin(angleFace) * distanceFace + 'px';

                            faceEmoji.style.setProperty('--tx', txFace);
                            faceEmoji.style.setProperty('--ty', tyFace);
                            
                            faceEmoji.style.left = '50%';
                            faceEmoji.style.top = '50%';
                            
                            this.appendChild(faceEmoji);

                            setTimeout(() => {
                                faceEmoji.remove();
                            }, 800);
                        }
                    });
                });
            }

            const zoomModal = document.getElementById('zoom-modal');
            const zoomImg = document.getElementById('zoom-img');
            const zoomableImages = document.querySelectorAll('.photo-card img');

            zoomableImages.forEach(img => {
                img.classList.add('zoomable');
                img.addEventListener('click', (e) => {
                    e.stopPropagation(); 
                    zoomImg.src = img.src;
                    zoomModal.classList.add('active');
                });
            });

            if (zoomModal) {
                zoomModal.addEventListener('click', () => {
                    zoomModal.classList.remove('active');
                });
            }

            const photoGallery = document.querySelector('.photo-gallery');
            let isDown = false;
            let startX;
            let scrollLeft;

            if (photoGallery) {
                photoGallery.addEventListener('mousedown', (e) => {
                    isDown = true;
                    startX = e.pageX - photoGallery.offsetLeft;
                    scrollLeft = photoGallery.scrollLeft;
                });
                photoGallery.addEventListener('mouseleave', () => {
                    isDown = false;
                });
                photoGallery.addEventListener('mouseup', () => {
                    isDown = false;
                });
                photoGallery.addEventListener('mousemove', (e) => {
                    if (!isDown) return;
                    e.preventDefault();
                    const x = e.pageX - photoGallery.offsetLeft;
                    const walk = (x - startX) * 2; 
                    photoGallery.scrollLeft = scrollLeft - walk;
                });
            }

            const clockElement = document.getElementById('pink-clock');
            if (clockElement) {
                const updateClock = () => {
                    const now = new Date();
                    let hours = now.getHours();
                    let minutes = now.getMinutes();
                    let seconds = now.getSeconds();
                    const ampm = hours >= 12 ? 'PM' : 'AM';
                    
                    hours = hours % 12;
                    hours = hours ? hours : 12; 
                    minutes = minutes < 10 ? '0' + minutes : minutes;
                    seconds = seconds < 10 ? '0' + seconds : seconds;
                    
                    clockElement.textContent = `${hours}:${minutes}:${seconds} ${ampm}`;
                };
                setInterval(updateClock, 1000);
                updateClock();
            }

            const fetchGomiStatus = async () => {
                try {
                    const response = await fetch('https://illuxat.com/api/online/Gomi');
                    const data = await response.json();
                    
                    const dotElement = document.getElementById('api-status-dot');
                    const textElement = document.getElementById('api-status-text');
                    
                    if (dotElement && textElement && data && data.data && data.data.status) {
                        const statusVal = data.data.status.toLowerCase();
                        
                        if (statusVal === 'online') {
                            textElement.textContent = 'En Línea';
                            dotElement.className = 'status-dot dot-online';
                        } else if (statusVal === 'available') {
                            textElement.textContent = 'Desconectado';
                            dotElement.className = 'status-dot dot-offline';
                        } else {
                            textElement.textContent = 'Desconectado';
                            dotElement.className = 'status-dot dot-offline';
                        }
                    }
                } catch (err) {
                    console.log('Error API de Estado:', err);
                }
            };
            
            fetchGomiStatus();
            setInterval(fetchGomiStatus, 30000);

        });

        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'F12' || e.keyCode === 123) {
                e.preventDefault();
            }
            if ((e.ctrlKey || e.metaKey) && (e.shiftKey || e.altKey) && (e.key.toLowerCase() === 'i' || e.keyCode === 73)) {
                e.preventDefault();
            }
            if ((e.ctrlKey || e.metaKey) && (e.shiftKey || e.altKey) && (e.key.toLowerCase() === 'c' || e.keyCode === 67)) {
                e.preventDefault();
            }
            if ((e.ctrlKey || e.metaKey) && (e.shiftKey || e.altKey) && (e.key.toLowerCase() === 'j' || e.keyCode === 74)) {
                e.preventDefault();
            }
            if ((e.ctrlKey || e.metaKey) && (e.key.toLowerCase() === 'u' || e.keyCode === 85)) {
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
