<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Gomi Xatspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Road+Rage&family=Outfit:wght@300;400;500;600;700&family=Special+Elite&display=swap">
<style>
:root{
--bg-color-1:#0a0a0a;--bg-color-2:#1a1a1a;--accent-main:#fff;--accent-hover:#666;--accent-bright:#fff;--text-dark:#fff;--text-muted:#ccc;
--glass-bg:rgba(20,20,20,.75);--glass-border:rgba(255,255,255,.15);--glass-highlight:rgba(255,255,255,.3);
--shadow-sm:0 4px 12px rgba(0,0,0,.5);--shadow-md:0 8px 24px -4px rgba(0,0,0,.7);--shadow-lg:0 16px 40px -8px rgba(0,0,0,.9);--shadow-hover:0 24px 48px -12px rgba(255,255,255,.2);
--transition-smooth:all .5s cubic-bezier(.16,1,.3,1);}
*{margin:0;padding:0;box-sizing:border-box}
img[src=""],img:not([src]){opacity:0!important;visibility:hidden!important;pointer-events:none!important;box-shadow:none!important}
body{font-family:'Outfit',sans-serif;color:var(--text-dark);background-color:var(--bg-color-1);overflow:hidden;width:100vw;height:100vh;height:100dvh;max-width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased;padding-top:max(65px,env(safe-area-inset-top));padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);padding-bottom:env(safe-area-inset-bottom)}

/* Grano: capa más chica, sin mix-blend-mode, solo transform */
body::before{content:"";position:fixed;top:-10%;left:-10%;width:120%;height:120%;pointer-events:none;z-index:9998;will-change:transform;
background:url('data:image/svg+xml,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="1.8" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)" opacity="0.08"/%3E%3C/svg%3E');
animation:grain-anim .3s steps(4) infinite}
@keyframes grain-anim{0%{transform:translate(0,0)}25%{transform:translate(-1%,-1%)}50%{transform:translate(-2%,1%)}75%{transform:translate(1%,-2%)}100%{transform:translate(0,0)}}

/* Scanlines: animadas con transform (GPU) */
#scanlines{position:fixed;top:-400px;left:0;width:100vw;height:calc(100vh + 400px);pointer-events:none;z-index:9998;opacity:.15;
background:linear-gradient(to bottom,rgba(255,255,255,0),rgba(255,255,255,0) 50%,rgba(0,0,0,.3) 50%,rgba(0,0,0,.3));background-size:100% 4px;will-change:transform;animation:scanline-scroll 3.2s linear infinite}
@keyframes scanline-scroll{from{transform:translateY(0)}to{transform:translateY(400px)}}

img,video{filter:grayscale(100%) contrast(120%);transition:filter .4s ease;max-width:100%}
iframe{filter:none!important;max-width:100%}
.photo-card img:hover,.gif-item:hover,.v-music-stacked video:hover{filter:grayscale(0%) contrast(100%)}
#intro-screen video.intro-bg{filter:none}

@media (pointer:fine){
*{cursor:none!important}
.custom-cursor{position:fixed;top:0;left:0;pointer-events:none;z-index:9999;width:32px;height:32px;will-change:transform;display:flex;justify-content:center;align-items:center}
.custom-cursor::after{content:'';width:100%;height:100%;background:url('cursor.png') no-repeat center;background-size:contain;filter:drop-shadow(0 0 5px rgba(255,255,255,.5))}
.cursor-trail{position:fixed;top:0;left:0;pointer-events:none;z-index:9998;width:10px;height:10px;border-radius:50%;background:var(--accent-bright);box-shadow:0 0 8px 2px rgba(255,255,255,.6);will-change:transform;opacity:.4}
}

#bg-video{position:fixed;top:0;left:0;width:100vw;height:100vh;object-fit:cover;z-index:-3;pointer-events:none;opacity:1;transform:translateZ(0);filter:none}
#particles-canvas{position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:-1}
#cursor-canvas{position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:9997}
.ambient-background{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:-2;background:linear-gradient(135deg,rgba(10,10,10,.4),rgba(26,26,26,.45));pointer-events:none}

.clouds-container{position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:-2;overflow:hidden}
.cloud{position:absolute;border-radius:50%;background:radial-gradient(closest-side,#fff,rgba(255,255,255,0));opacity:.1;animation:drift linear infinite;will-change:transform}
.cloud-1{width:420px;height:160px;top:15%;left:-450px;animation-duration:45s}
.cloud-2{width:350px;height:130px;top:65%;left:-400px;animation-duration:60s;opacity:.05}
.cloud-3{width:560px;height:200px;top:35%;left:-600px;animation-duration:75s;opacity:.08}
@keyframes drift{from{transform:translateX(-15vw)}to{transform:translateX(115vw)}}

.navbar{position:fixed;top:calc(clamp(1rem,3vh,2rem) + max(65px,env(safe-area-inset-top)));left:50%;transform:translateX(-50%);z-index:1000;background:rgba(0,0,0,.82);border:1px solid var(--glass-border);border-top:1px solid var(--glass-highlight);border-radius:4px;padding:.5rem 1rem;display:flex;gap:clamp(.2rem,1vw,.5rem);box-shadow:var(--shadow-sm);max-width:calc(100vw - 2rem);width:max-content}
.nav-link{text-decoration:none;color:var(--text-dark);font-size:clamp(.75rem,1.5vh,.85rem);font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:clamp(.4rem,1vh,.6rem) clamp(.8rem,2vw,1.2rem);border-radius:4px;transition:var(--transition-smooth);cursor:pointer;border:none;background:transparent;font-family:inherit}
.nav-link:hover,.nav-link.active{color:#fff;background:var(--accent-hover);box-shadow:var(--shadow-sm)}

/* Panel principal: sin backdrop-filter (era lo más pesado), fondo más opaco */
.main-glass-panel{width:90vw;max-width:1200px;height:clamp(400px,80dvh,85dvh);max-height:calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 80px);margin-top:clamp(3rem,8vh,5rem);background:rgba(16,16,16,.88);border:1px solid var(--glass-border);border-top:1px solid var(--glass-highlight);border-radius:4px;box-shadow:var(--shadow-lg);position:relative;z-index:10;overflow:hidden;-webkit-backface-visibility:hidden;backface-visibility:hidden;transform:translateZ(0);contain:layout paint}

.tab-content{position:absolute;top:0;left:0;width:100%;height:100%;padding:clamp(1.5rem,4vh,4rem);opacity:0;pointer-events:none;visibility:hidden;transform:translateY(20px) scale(.98);transition:var(--transition-smooth);display:flex;align-items:center;justify-content:center;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.tab-content::-webkit-scrollbar{width:0;display:none;background:transparent}
.tab-content.active{opacity:1;pointer-events:auto;visibility:visible;transform:translateY(0) scale(1)}
/* No animar lo que no se ve */
.tab-content:not(.active) *,.tab-content:not(.active) *::before,.tab-content:not(.active) *::after{animation-play-state:paused!important}
/* El parallax mueve transform: sin transición en transform */
html body .js-parallax{transition:filter .4s ease,box-shadow .5s cubic-bezier(.16,1,.3,1),border-color .5s cubic-bezier(.16,1,.3,1),background .5s cubic-bezier(.16,1,.3,1);will-change:transform}

.hero-layout{display:grid;grid-template-columns:1fr 1fr;width:100%;height:100%;gap:clamp(1.5rem,4vw,4rem);align-items:center}
#tab-hero{flex-direction:column;justify-content:flex-start}
#tab-hero .hero-layout{height:auto;flex:1 0 auto;min-height:0}
.hero-content{display:flex;flex-direction:column;gap:clamp(1rem,2vh,1.5rem);max-width:100%}

.status-container{display:flex;align-items:center;gap:.8rem;background:rgba(0,0,0,.6);padding:.5rem 1rem;width:fit-content;max-width:100%;border:1px solid var(--accent-main);margin-bottom:.5rem;box-shadow:var(--shadow-sm);border-radius:2px;position:relative;margin-top:85px}
.avatar-mini{width:50px;height:50px;flex-shrink:0;border-radius:2px;background:#000;border:1px solid var(--accent-main);overflow:hidden;display:flex;justify-content:center;align-items:center}
.avatar-mini img{width:100%;height:100%;object-fit:cover;pointer-events:none}
.status-info{display:flex;flex-direction:column;justify-content:center;transition:transform .3s ease;cursor:default}
.status-info:hover{transform:translateY(-2px)}
.status-text{font-size:1rem;font-weight:700;color:var(--text-dark);transition:all .3s ease}
.status-info:hover .status-text{color:#fff;text-shadow:0 0 8px rgba(255,255,255,.8)}
.status-dot{width:8px;height:8px;flex-shrink:0;background:transparent;border-radius:50%}
.dot-online{background:#2ecc71;box-shadow:0 0 8px #2ecc71;animation:pulse-dot 1.5s infinite}
.dot-offline{background:#e74c3c;box-shadow:0 0 8px #e74c3c;animation:pulse-dot 1.5s infinite}
.status-year{font-size:.75rem;font-weight:600;color:var(--text-muted);transition:all .3s ease}
.status-info:hover .status-year{color:#fff}
@keyframes pulse-dot{0%{transform:scale(1);opacity:1}50%{transform:scale(1.3);opacity:.6}100%{transform:scale(1);opacity:1}}

/* Glitter */
.glitter-wrapper{position:relative;display:inline-flex;justify-content:center;align-items:center;width:100%;max-width:280px;margin:.5rem 0;z-index:5;transition:transform .4s cubic-bezier(.16,1,.3,1),filter .4s ease}
.glitter-wrapper:hover{transform:scale(1.05);filter:drop-shadow(0 0 15px rgba(220,20,60,.7))}
.glitter-wrapper img{width:100%;height:auto;display:block;object-fit:contain;filter:drop-shadow(0 4px 12px rgba(0,0,0,.5));transition:filter .4s ease}
.glitter-wrapper:hover img{filter:brightness(1.15) contrast(1.1)}
.glitter-wrapper::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:11;
background-image:radial-gradient(1.5px 1.5px at 15px 15px,white,transparent),radial-gradient(2px 2px at 40px 25px,white,transparent),radial-gradient(1px 1px at 20px 45px,white,transparent),radial-gradient(2.5px 2.5px at 60px 10px,white,transparent),radial-gradient(1.5px 1.5px at 75px 40px,white,transparent),radial-gradient(2px 2px at 90px 20px,white,transparent),radial-gradient(1px 1px at 10px 70px,white,transparent),radial-gradient(2px 2px at 50px 65px,white,transparent);
background-size:100px 80px;filter:brightness(1.2);
-webkit-mask-image:url("https://xatimg.com/image/ZB0I0MeLxBmf.png");-webkit-mask-size:contain;-webkit-mask-repeat:no-repeat;-webkit-mask-position:center;
mask-image:url("https://xatimg.com/image/ZB0I0MeLxBmf.png");mask-size:contain;mask-repeat:no-repeat;mask-position:center;
animation:glitterTwinkle 1.5s infinite alternate ease-in-out}
.glitter-wrapper::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:10;
background:linear-gradient(110deg,transparent 25%,rgba(255,255,255,.15) 40%,rgba(255,255,255,.65) 47%,#fff 50%,rgba(255,255,255,.65) 53%,rgba(255,255,255,.15) 60%,transparent 75%);background-size:200% 100%;
-webkit-mask-image:url("https://xatimg.com/image/ZB0I0MeLxBmf.png");-webkit-mask-size:contain;-webkit-mask-repeat:no-repeat;-webkit-mask-position:center;
mask-image:url("https://xatimg.com/image/ZB0I0MeLxBmf.png");mask-size:contain;mask-repeat:no-repeat;mask-position:center;
animation:glitterShineSweep 3.5s infinite linear;opacity:.7}
@keyframes glitterShineSweep{0%{background-position:200% center}100%{background-position:-200% center}}
@keyframes glitterTwinkle{0%{opacity:.1}100%{opacity:.9}}
@keyframes glitterMove{0%{background-position:0 0}100%{background-position:100px 80px}}

.hero-text-block{display:flex;flex-direction:column;gap:clamp(.2rem,1vh,.5rem);max-width:100%}
.fade-text{transition:opacity .8s ease-in-out;opacity:1;max-width:100%}
.fade-text.hidden{opacity:0}
.hero-subtitle{font-family:'Special Elite',monospace;font-size:clamp(1.4rem,2.8vh,1.8rem);font-weight:400;color:var(--text-dark);word-wrap:break-word}
.hero-description{font-family:'Special Elite',monospace;font-size:clamp(.95rem,1.8vh,1.25rem);font-weight:500;color:var(--text-muted);max-width:95%;line-height:1.5;word-wrap:break-word}
.gemini-block{display:flex;flex-direction:column;align-items:flex-start;gap:.5rem;margin-top:.5rem}
.btn-click-me{position:relative;background:rgba(0,0,0,.5);border:1px solid var(--accent-bright);color:var(--accent-main);border-radius:2px;padding:.3rem 1rem;font-weight:700;font-size:.8rem;cursor:pointer;transition:var(--transition-smooth);font-family:inherit;overflow:visible;text-transform:uppercase}
.btn-click-me:hover{background:var(--accent-hover);color:#fff;border-color:var(--accent-hover);box-shadow:var(--shadow-sm)}
.sparkle-particle{position:absolute;width:36px;height:36px;pointer-events:none;z-index:9999;animation:sparkleFly .8s ease-out forwards;filter:drop-shadow(0 0 6px var(--accent-bright)) brightness(1.2)}
@keyframes sparkleFly{0%{transform:translate(-50%,-50%) scale(.5) rotate(0);opacity:1}70%{opacity:1}100%{transform:translate(var(--tx),var(--ty)) scale(1.6) rotate(90deg);opacity:0}}

/* Reloj: sin backdrop-filter */
.pink-clock{font-size:clamp(1.1rem,2.5vh,1.4rem);font-weight:400;color:var(--accent-bright);background:rgba(0,0,0,.75);border:1px solid var(--glass-highlight);padding:.4rem 1.2rem;border-radius:2px;box-shadow:var(--shadow-sm);letter-spacing:2px;transition:var(--transition-smooth);z-index:5;text-align:center;max-width:100%}
.pink-clock:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);background:var(--accent-hover);color:#fff;border-color:var(--accent-hover)}

.hero-visuals{display:flex;justify-content:center;align-items:center;height:100%;width:100%;flex-direction:column;gap:1.5rem}
.gif-grid{width:clamp(260px,90%,650px);max-width:100%;aspect-ratio:4/3;display:grid;grid-template-columns:1fr 1.5fr 1fr;grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:6px;border-radius:4px;border:2px solid #444;padding:6px;background:#000;box-shadow:var(--shadow-lg);transition:var(--transition-smooth);overflow:hidden}
.gif-grid:hover{transform:translateY(-4px);box-shadow:10px 10px 0 var(--accent-hover);border-color:var(--accent-hover)}
.gif-item{width:100%;height:100%;max-width:100%;max-height:100%;min-width:0;min-height:0;object-fit:cover;border-radius:2px;filter:grayscale(100%) contrast(120%);transition:var(--transition-smooth)}
.gif-item:hover{filter:grayscale(0%) contrast(100%)}
.gif-item:nth-child(1){grid-column:1;grid-row:1}
.gif-item:nth-child(2){grid-column:1;grid-row:2}
.gif-item:nth-child(3){grid-column:2;grid-row:1/span 2;object-fit:contain}
.gif-item:nth-child(4){grid-column:3;grid-row:1}
.gif-item:nth-child(5){grid-column:3;grid-row:2}

.footer-signature{position:relative;font-size:.7rem;font-weight:500;color:var(--text-muted);opacity:.6;pointer-events:none;white-space:nowrap;letter-spacing:.05em;width:100%;text-align:center;margin-top:auto;padding-top:1.5rem;flex-shrink:0}

.music-layout{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:clamp(1rem,3vh,2rem);width:100%;height:100%;padding-top:2vh}
.section-header{text-align:center;max-width:100%}
.section-title{font-size:clamp(2.5rem,6vh,4rem);color:var(--accent-main);line-height:1;font-weight:400;word-wrap:break-word}
.music-content{display:flex;flex-direction:row;align-items:center;justify-content:center;width:100%;height:100%;position:relative}
.player-pro{display:flex;flex-direction:column;align-items:center;gap:clamp(1.5rem,3vh,2rem);position:relative;width:100%;max-width:350px;z-index:5}
.player-disc{width:clamp(140px,25vh,220px);height:clamp(140px,25vh,220px);border-radius:50%;background:linear-gradient(135deg,rgba(20,20,20,.9),rgba(50,50,50,.4));border:1px solid var(--glass-highlight);box-shadow:var(--shadow-md),inset 0 4px 20px rgba(0,0,0,.6);display:flex;justify-content:center;align-items:center;position:relative}
.player-disc::before,.player-disc::after{content:'';position:absolute;width:100%;height:100%;border-radius:50%;border:1px solid var(--accent-main);opacity:0;transition:var(--transition-smooth)}
.is-playing .player-disc::before{animation:soundRipple 2s linear infinite}
.is-playing .player-disc::after{animation:soundRipple 2s linear infinite 1s}
@keyframes soundRipple{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.6);opacity:0}}
.btn-play{width:clamp(50px,10vh,80px);height:clamp(50px,10vh,80px);background:var(--bg-color-1);border-radius:50%;border:2px solid #fff;box-shadow:0 8px 24px rgba(0,0,0,.4);display:flex;justify-content:center;align-items:center;transition:var(--transition-smooth);z-index:10;cursor:pointer}
.btn-play:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn-play svg{width:clamp(18px,3vh,28px);fill:#fff;margin-left:4px;transition:var(--transition-smooth)}
.player-controls{width:70%;background:rgba(0,0,0,.8);padding:clamp(.4rem,1vh,.7rem) 1rem;border-radius:4px;display:flex;align-items:center;gap:.7rem;box-shadow:var(--shadow-sm);border:1px solid var(--glass-border);margin-top:15px}
.icon-svg{width:clamp(11px,2vh,15px);fill:var(--text-muted);flex-shrink:0}
.volume-slider{-webkit-appearance:none;width:100%;height:3px;background:var(--bg-color-2);border-radius:2px;outline:none}
.volume-slider::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:2px;background:var(--accent-main);box-shadow:0 2px 4px rgba(0,0,0,.4);transition:transform .2s;cursor:pointer}
.volume-slider::-webkit-slider-thumb:hover{background:var(--accent-hover)}
.v-music-stacked{position:relative;width:70%;max-width:245px;aspect-ratio:16/9;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.2);border-radius:4px;padding:4px;box-shadow:var(--shadow-sm);transition:var(--transition-smooth);margin-top:15px}
.v-music-stacked video{width:100%;height:100%;object-fit:cover;border-radius:2px;filter:grayscale(100%) contrast(120%);transition:var(--transition-smooth)}
.v-music-stacked:hover video{filter:grayscale(0%) contrast(100%)}

.photo-gallery{display:flex;flex-direction:row;gap:1.5rem;width:100%;flex:1;overflow-x:auto;overflow-y:visible;padding:2.5rem 1.5rem;align-items:center;justify-content:flex-start;-webkit-overflow-scrolling:touch;touch-action:pan-x;cursor:grab;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.5) transparent}
.photo-gallery:active{cursor:grabbing}
.photo-card:first-child{margin-left:auto}
.photo-card:last-child{margin-right:auto}
.photo-gallery::after{content:'';min-width:1px}
.photo-gallery::-webkit-scrollbar{height:6px}
.photo-gallery::-webkit-scrollbar-track{background:transparent}
.photo-gallery::-webkit-scrollbar-thumb{background:rgba(255,255,255,.5);border-radius:10px}
.photo-card{flex:0 0 auto;width:clamp(160px,40vw,220px);height:clamp(240px,50vh,320px);background:rgba(255,255,255,.4);border:1px solid #fff;border-radius:24px;padding:0;box-shadow:var(--shadow-sm);transition:transform .4s cubic-bezier(.16,1,.3,1),box-shadow .4s ease,border-color .4s ease;display:flex;justify-content:center;align-items:center;overflow:visible;position:relative;z-index:1;margin-top:10px;margin-bottom:10px}
.photo-card:hover{transform:translateY(-8px) scale(1.02);box-shadow:0 0 25px rgba(255,255,255,.5),0 10px 30px rgba(0,0,0,.9);border-color:#fff;z-index:10}
.photo-card img{width:100%;height:100%;object-fit:cover;border-radius:24px;display:block;user-select:none;-webkit-user-drag:none;transition:transform .4s cubic-bezier(.16,1,.3,1),filter .4s ease}
html body .photo-card:hover img{transform:scale(1.1);filter:grayscale(100%) contrast(170%) brightness(.85)!important;animation:punk-glitch-anim .3s cubic-bezier(.25,.46,.45,.94) forwards}
.photo-card::after{content:'';position:absolute;top:0;left:0;width:100%;height:100%;background:url('data:image/svg+xml,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noise"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="1.8" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noise)" opacity="0.5"/%3E%3C/svg%3E');mix-blend-mode:overlay;pointer-events:none;opacity:0;transition:opacity .3s ease;z-index:2}
.photo-card:hover::after{opacity:1;animation:punk-noise-flicker .1s infinite linear alternate}
.photo-card::before{content:'';position:absolute;top:-2%;left:-2%;width:104%;height:104%;border-radius:24px;pointer-events:none;opacity:0;z-index:3;box-shadow:inset 0 0 0 rgba(255,255,255,0);transition:opacity .3s ease}
.photo-card:hover::before{opacity:1;animation:punk-border-glitch .4s ease-out forwards}
@keyframes punk-glitch-anim{0%{transform:scale(1) translate(0);filter:grayscale(100%) contrast(120%)}20%{transform:scale(1.1) translate(-3px,2px) skewX(2deg);filter:grayscale(100%) contrast(200%) brightness(1.2)}40%{transform:scale(1.12) translate(3px,-2px) skewX(-2deg);filter:grayscale(100%) contrast(150%) brightness(.7)}60%{transform:scale(1.1) translate(-1px,1px) skewX(0)}100%{transform:scale(1.1) translate(0);filter:grayscale(100%) contrast(170%) brightness(.85)}}
@keyframes punk-noise-flicker{0%{transform:translate(0,0)}100%{transform:translate(-2px,2px)}}
@keyframes punk-border-glitch{0%{box-shadow:inset 0 0 20px rgba(255,255,255,.8),inset 4px 0 0 rgba(100,100,100,.5),inset -4px 0 0 rgba(200,200,200,.5)}50%{box-shadow:inset 0 0 10px rgba(255,255,255,.5),inset -2px 0 0 rgba(100,100,100,.5),inset 2px 0 0 rgba(200,200,200,.5)}100%{box-shadow:inset 0 0 15px rgba(255,255,255,.3)}}

#intro-screen{position:fixed;top:0;left:0;width:100vw;height:100vh;height:100dvh;z-index:9995;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-bottom:max(15dvh,env(safe-area-inset-bottom));background:var(--bg-color-1);transition:opacity .8s ease-in-out;max-width:100%}
#intro-screen video.intro-bg{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:-1;filter:none}
.intro-hidden{opacity:0;pointer-events:none}

/* Zoom: sin backdrop-filter y oculto de verdad cuando no está activo */
.zoom-modal{position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,.92);z-index:10000;display:flex;justify-content:center;align-items:center;opacity:0;pointer-events:none;visibility:hidden;transition:opacity .3s ease,visibility 0s .3s}
.zoom-modal.active{opacity:1;pointer-events:auto;visibility:visible;transition:opacity .3s ease}
.zoom-modal img{max-width:90%;max-height:90%;border-radius:2px;box-shadow:0 10px 40px rgba(0,0,0,.5);border:2px solid #fff;transform:scale(.8);transition:transform .3s ease;filter:none;object-fit:contain}
.zoom-modal.active img{transform:scale(1)}
.zoomable{cursor:pointer}

.btn-glass-pink{position:relative;background:rgba(0,0,0,.65);border:1px solid rgba(255,255,255,.6);border-radius:2px;padding:1rem 3rem;font-size:1.5rem;font-weight:700;color:var(--text-dark);cursor:pointer;transition:var(--transition-smooth);font-family:inherit;box-shadow:0 8px 32px rgba(0,0,0,.5),inset 0 0 10px rgba(255,255,255,.1);text-transform:uppercase;letter-spacing:.05em;z-index:2;max-width:90vw}
.btn-glass-pink:hover{background:var(--accent-hover);transform:translateY(-3px) scale(1.02);border-color:var(--accent-hover);box-shadow:0 12px 40px rgba(255,255,255,.2),inset 0 0 15px rgba(255,255,255,.2);color:#fff}

@media (max-width:992px){
.tab-content{align-items:flex-start}
.hero-layout{display:flex;flex-direction:column;height:auto;min-height:100%;gap:1.5rem;text-align:center;justify-items:center;padding-bottom:2rem}

}
@media (max-width:600px){
.navbar{width:max-content;max-width:calc(100vw - 1rem);border-radius:4px;flex-wrap:wrap;justify-content:center;padding:.5rem;top:calc(.5rem + max(65px,env(safe-area-inset-top)))}

<script>
document.addEventListener("DOMContentLoaded", () => {
    const canvas = document.getElementById('particles-canvas');
    const ctx = canvas.getContext('2d');
    const cursorCanvas = document.getElementById('cursor-canvas');
    const cursorCtx = cursorCanvas.getContext('2d');
    const particleColors = ['#FFFFFF', '#AAAAAA', '#666666'];
    const shapes = ['✦', '✧', '⋆'];
    const hasHover = window.matchMedia("(hover: hover)").matches;
    const finePointer = window.matchMedia("(pointer: fine)").matches;
    let mouseX = innerWidth / 2, mouseY = innerHeight / 2, moved = false, clicking = false;
    let cursorEl = null, trailEl = null, trailX = mouseX, trailY = mouseY;
    let pCurrentX = 0, pCurrentY = 0, lastPX = NaN, lastPY = NaN;
    const cursorParticles = [];

    // Sprites con glow pre-renderizados: el shadowBlur se dibuja una sola vez
    const sprites = {};
    const getSprite = (shape, color) => {
        const k = shape + color;
        if (sprites[k]) return sprites[k];
        const c = document.createElement('canvas'); c.width = c.height = 64;
        const g = c.getContext('2d');
        g.font = '40px Arial'; g.textAlign = 'center'; g.textBaseline = 'middle';
        g.fillStyle = color; g.shadowBlur = 8; g.shadowColor = color;
        g.fillText(shape, 32, 32);
        return sprites[k] = c;
    };
    const drawSprite = (g, shape, color, x, y, fontPx, alpha) => {
        const s = 64 * fontPx / 40;
        g.globalAlpha = alpha;
        g.drawImage(getSprite(shape, color), x - s / 2 + fontPx / 2, y - s / 2 - fontPx / 3, s, s);
    };

    // Cursor personalizado (solo transform, sin layout)
    if (finePointer) {
        cursorEl = document.createElement('div'); cursorEl.className = 'custom-cursor';
        trailEl = document.createElement('div'); trailEl.className = 'cursor-trail';
        document.body.append(cursorEl, trailEl);
        window.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; moved = true; }, { passive: true });
        window.addEventListener('mousedown', () => clicking = true);
        window.addEventListener('mouseup', () => clicking = false);
    }

    // Parallax: elementos de la pestaña activa en caché
    let parallaxEls = [];
    const refreshParallax = () => {
        parallaxEls = [...document.querySelectorAll('.tab-content.active .js-parallax')];
        lastPX = NaN;
    };

    // Pestañas + pausa de videos que no se ven
    const navLinks = document.querySelectorAll('.nav-link');
    const tabs = document.querySelectorAll('.tab-content');
    const syncVideos = () => tabs.forEach(t => {
        const on = t.classList.contains('active');
        t.querySelectorAll('video').forEach(v => on ? v.play().catch(() => {}) : v.pause());
    });
    navLinks.forEach(link => {
        link.addEventListener('click', (e) => {
            e.preventDefault();
            const targetId = link.getAttribute('data-target');
            navLinks.forEach(l => l.classList.remove('active'));
            tabs.forEach(t => t.classList.remove('active'));
            link.classList.add('active');
            document.getElementById(targetId).classList.add('active');
            syncVideos(); refreshParallax();
        });
    });
    syncVideos(); refreshParallax();

    // Audio
    const audio = document.getElementById('audio-player');
    const btnPlayPause = document.getElementById('btn-play-pause');
    const iconPlay = document.getElementById('icon-play');
    const iconPause = document.getElementById('icon-pause');
    const volumeSlider = document.getElementById('volume-slider');
    const musicUI = document.getElementById('music-ui');
    let isPlaying = false;
    audio.volume = volumeSlider.value;
    btnPlayPause.addEventListener('click', () => {
        if (isPlaying) {
            audio.pause();
            iconPlay.style.display = 'block'; iconPause.style.display = 'none';
            musicUI.classList.remove('is-playing');
        } else {
            audio.play().catch(e => console.log("Auto-play prevented"));
            iconPlay.style.display = 'none'; iconPause.style.display = 'block';
            musicUI.classList.add('is-playing');
        }
        isPlaying = !isPlaying;
    });
    volumeSlider.addEventListener('input', (e) => audio.volume = e.target.value);

    // Intro: el video de fondo arranca al entrar y el de intro se detiene
    const introScreen = document.getElementById('intro-screen');
    const btnEnter = document.getElementById('btn-enter');
    const bgVideo = document.getElementById('bg-video');
    const introVideo = document.getElementById('intro-bg-video');
    if (!btnEnter || !introScreen) bgVideo.play().catch(() => {});
    else btnEnter.addEventListener('click', () => {
        introScreen.classList.add('intro-hidden');
        bgVideo.play().catch(() => {});
        setTimeout(() => { introScreen.style.display = 'none'; if (introVideo) introVideo.pause(); }, 800);
        if (!isPlaying) {
            audio.play().then(() => {
                iconPlay.style.display = 'none'; iconPause.style.display = 'block';
                musicUI.classList.add('is-playing'); isPlaying = true;
            }).catch(e => console.log("Autoplay bloqueado:", e));
        }
    });

    function resize() {
        canvas.width = cursorCanvas.width = window.innerWidth;
        canvas.height = cursorCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    class Particle {
        constructor() { this.reset(); this.y = Math.random() * canvas.height; }
        reset() {
            this.x = Math.random() * canvas.width;
            this.y = canvas.height + 20;
            this.size = Math.random() * 3 + 1.5;
            this.speedY = Math.random() * 0.4 + 0.1;
            this.speedX = (Math.random() - 0.5) * 0.2;
            this.color = particleColors[Math.floor(Math.random() * particleColors.length)];
            this.shape = shapes[Math.floor(Math.random() * shapes.length)];
            this.opacity = Math.random() * 0.5 + 0.2;
        }
        update() {
            this.y -= this.speedY; this.x += this.speedX;
            this.x -= pCurrentX * this.size * 0.5;
            this.y -= pCurrentY * this.size * 0.5;
            if (this.y < -30) this.reset();
        }
        draw() { drawSprite(ctx, this.shape, this.color, this.x, this.y, this.size * 5, this.opacity); }
    }

    class CursorStar {
        constructor(x, y) {
            this.x = x; this.y = y;
            this.size = Math.random() * 2 + 2;
            this.vx = (Math.random() - 0.5) * 2.5;
            this.vy = (Math.random() - 0.5) * 2.5;
            this.life = 1.0;
            this.decay = Math.random() * 0.02 + 0.01;
            this.color = particleColors[Math.floor(Math.random() * particleColors.length)];
            this.shape = shapes[Math.floor(Math.random() * shapes.length)];
        }
        update() { this.x += this.vx; this.y += this.vy; this.life -= this.decay; }
        draw() { if (this.life > 0) drawSprite(cursorCtx, this.shape, this.color, this.x, this.y, this.size * 6, this.life); }
    }

    const particles = [];
    const particleCount = window.innerWidth < 768 ? 20 : 40;
    for (let i = 0; i < particleCount; i++) particles.push(new Particle());

    // UN solo bucle para cursor, parallax y partículas
    let frame = 0, cursorDirty = false;
    function animate() {
        if (cursorEl) {
            cursorEl.style.transform = `translate3d(${mouseX}px,${mouseY}px,0) translate(-50%,-50%) scale(${clicking ? 0.8 : 1})`;
            trailX += (mouseX - trailX) * 0.2; trailY += (mouseY - trailY) * 0.2;
            trailEl.style.transform = `translate3d(${trailX}px,${trailY}px,0) translate(-50%,-50%)`;
            if (moved) {
                moved = false;
                if (cursorParticles.length < 50) for (let i = 0; i < 1; i++) cursorParticles.push(new CursorStar(mouseX, mouseY));
            }
        }

        pCurrentX += ((mouseX / window.innerWidth - 0.5) * 2 - pCurrentX) * 0.05;
        pCurrentY += ((mouseY / window.innerHeight - 0.5) * 2 - pCurrentY) * 0.05;
        if (hasHover && (!(Math.abs(pCurrentX - lastPX) < 0.0003) || !(Math.abs(pCurrentY - lastPY) < 0.0003))) {
            lastPX = pCurrentX; lastPY = pCurrentY;
            for (const el of parallaxEls) {
                const depth = parseFloat(el.dataset.depth) || 0.1;
                el.style.transform = `translate3d(${pCurrentX * depth * 150}px, ${pCurrentY * depth * 150}px, 0)`;
            }
        }

        if (++frame % 2 === 0) { ctx.clearRect(0, 0, canvas.width, canvas.height); for (const p of particles) { p.update(); p.update(); p.draw(); } }

        if (cursorParticles.length || cursorDirty) {
            cursorCtx.clearRect(0, 0, cursorCanvas.width, cursorCanvas.height);
            for (let i = cursorParticles.length - 1; i >= 0; i--) {
                const s = cursorParticles[i];
                s.update();
                if (s.life <= 0) cursorParticles.splice(i, 1); else s.draw();
            }
            cursorDirty = cursorParticles.length > 0;
        }
        requestAnimationFrame(animate);
    }
    animate();
    document.addEventListener('visibilitychange', () => {
        if (document.hidden) bgVideo.pause();
        else if (introScreen.style.display === 'none' || !btnEnter) bgVideo.play().catch(() => {});
    });

    const heroQuotes = [
        { title: "GOMI", desc: "La MamiChula" },
        { title: "GOMI", desc: "Una bad bitch, Girl De lo' 90" },
        { title: "GOMI", desc: "Fina pero bandida" },
        { title: "GOMI", desc: "Más perra que el filtro de snapchat" }
    ];
    let currentQuote = 0;
    const quoteContent = document.getElementById('quote-content');
    const quoteTitle = document.getElementById('quote-title');
    const quoteDesc = document.getElementById('quote-desc');
    if (quoteContent) {
        setInterval(() => {
            quoteContent.classList.add('hidden');
            setTimeout(() => {
                currentQuote = (currentQuote + 1) % heroQuotes.length;
                quoteTitle.textContent = heroQuotes[currentQuote].title;
                quoteDesc.textContent = heroQuotes[currentQuote].desc;
                quoteContent.classList.remove('hidden');
            }, 800);
        }, 5000);
    }

    document.querySelectorAll('.btn-click-me').forEach(btn => {
        btn.addEventListener('click', function () {
            for (let i = 0; i < 6; i++) {
                const face = document.createElement('img');
                face.src = 'https://xatimg.com/image/EbjBtXj82zo3.png';
                face.className = 'sparkle-particle';
                face.style.width = '45px'; face.style.height = '45px';
                face.style.objectFit = 'contain'; face.style.background = 'transparent';
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * 40 + 35;
                face.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
                face.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
                face.style.left = '50%'; face.style.top = '50%';
                this.appendChild(face);
                setTimeout(() => face.remove(), 800);
            }
        });
    });

    const zoomModal = document.getElementById('zoom-modal');
    const zoomImg = document.getElementById('zoom-img');
    document.querySelectorAll('.photo-card img').forEach(img => {
        img.classList.add('zoomable');
        img.addEventListener('click', (e) => {
            e.stopPropagation();
            zoomImg.src = img.src;
            zoomModal.classList.add('active');
        });
    });
    if (zoomModal) zoomModal.addEventListener('click', () => zoomModal.classList.remove('active'));

    const photoGallery = document.querySelector('.photo-gallery');
    let isDown = false, startX, scrollLeft;
    if (photoGallery) {
        photoGallery.addEventListener('mousedown', (e) => {
            isDown = true;
            startX = e.pageX - photoGallery.offsetLeft;
            scrollLeft = photoGallery.scrollLeft;
        });
        photoGallery.addEventListener('mouseleave', () => isDown = false);
        photoGallery.addEventListener('mouseup', () => isDown = false);
        photoGallery.addEventListener('mousemove', (e) => {
            if (!isDown) return;
            e.preventDefault();
            photoGallery.scrollLeft = scrollLeft - (e.pageX - photoGallery.offsetLeft - startX) * 2;
        });
    }

    const clockElement = document.getElementById('pink-clock');
    if (clockElement) {
        const updateClock = () => {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            seconds = seconds < 10 ? '0' + seconds : seconds;
            clockElement.textContent = `${hours}:${minutes}:${seconds} ${ampm}`;
        };
        setInterval(updateClock, 1000);
        updateClock();
    }

    const fetchGomiStatus = async () => {
        if (document.hidden) return;
        try {
            const response = await fetch('https://illuxat.com/api/online/Gomi');
            const data = await response.json();
            const dotElement = document.getElementById('api-status-dot');
            const textElement = document.getElementById('api-status-text');
            if (dotElement && textElement && data && data.data && data.data.status) {
                if (data.data.status.toLowerCase() === 'online') {
                    textElement.textContent = 'En Línea';
                    dotElement.className = 'status-dot dot-online';
                } else {
                    textElement.textContent = 'Desconectado';
                    dotElement.className = 'status-dot dot-offline';
                }
            }
        } catch (err) {
            console.log('Error API de Estado:', err);
        }
    };
    fetchGomiStatus();
    setInterval(fetchGomiStatus, 30000);
});

document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('keydown', function (e) {
    const k = (e.key || '').toLowerCase();
    if (e.key === 'F12' || e.keyCode === 123) e.preventDefault();
    if ((e.ctrlKey || e.metaKey) && (e.shiftKey || e.altKey) && (k === 'i' || k === 'c' || k === 'j')) e.preventDefault();
    if ((e.ctrlKey || e.metaKey) && k === 'u') e.preventDefault();
});
</script>
</body>
</html>
